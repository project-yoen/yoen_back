spring.application.name=YOEN_BACK
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# lazy 로딩을 IN 쿼리로 묶어 N+1 완화 (컬렉션/프록시 최대 100개 단위)
spring.jpa.properties.hibernate.default_batch_fetch_size=100
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.codec.max-in-memory-size=10MB

firebase.config.path=${FIREBASE_PATH}
firebase.storage.bucket=${FIREBASE_BUCKET}

# Redis ?? ?? ??
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

jwt.secret=${JWT_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

springdoc.swagger-ui.enabled = true
springdoc.api-docs.enabled= true
springdoc.packages-to-scan= com

springdoc.override-with-generic-response: true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# SQL 가시성 (로컬 측정용) - p6spy는 developmentOnly 의존성이라 운영 jar에는 없음
# HIBERNATE_STATS=true 로 켜면 세션(요청)당 JDBC statement 수/시간이 로그에 찍힘
spring.jpa.properties.hibernate.generate_statistics=${HIBERNATE_STATS:false}
decorator.datasource.p6spy.log-format=took %(executionTime) ms | %(sql)
